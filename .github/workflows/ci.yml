name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://app_user:pass@localhost:5432/analytics
      DATABASE_MIGRATION_URL: postgres://postgres:pass@localhost:5432/analytics
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: dGhpc2lzYXNlY3JldGtleWZvcnNlc3Npb25zb2ZhdGxlYXN0MzJieXRlcw==
      ENCRYPTION_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_ENV: test
      NODE_ENV: test
      PORT: 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Initialize Non-Superuser Database Role
        run: npx tsx scripts/init-ci-db.ts

      - name: Run Database Migrations
        run: npm run db:migrate

      - name: Run Vitest Test Suite
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
